# Keeps the SHA-pinned actions and their version comments up to date (the engine requires full commit SHAs).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A new release waits 7 days before it is proposed: a compromised release is usually found and pulled by then.
    cooldown:
      default-days: 7
