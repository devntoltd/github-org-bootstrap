name: Recurring operations

# Opens a reminder issue for every recurring operation that is due (tools/Invoke-RecurringReminder.ps1), an issue to
# review a GitHub REST API version newer than the pinned one (tools/Invoke-GitHubApiVersionCheck.ps1), an issue per
# organization API operation the endpoint catalog of the engine does not match (tools/Invoke-ApiEndpointCheck.ps1), and
# an issue for module and tool versions newer than the lock (tools/Find-DependencyUpdate.ps1,
# tools/Invoke-DependencyUpdateCheck.ps1); all write their status to the job summary.
on:
  schedule:
    # Monday 06:17 UTC: away from the start of the hour, when GitHub delays scheduled runs.
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only report the status; open no issue and create no label
        type: boolean
        default: true

permissions: {}

# Two runs at once could open the same reminder twice.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  remind:
    name: Open due reminders
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # opens the reminders and creates their labels
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # gh and PowerShell 7 are on the runner. A scheduled run has no inputs, so DRY_RUN is empty there.
      - name: Open due reminders
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: ./tools/Invoke-RecurringReminder.ps1 -WhatIf:($env:DRY_RUN -eq 'true')

  api-version:
    name: Check the GitHub REST API version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # opens the review issue and creates its label
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the GitHub REST API version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: ./tools/Invoke-GitHubApiVersionCheck.ps1 -WhatIf:($env:DRY_RUN -eq 'true')

  # The description is public and only parsed as JSON, never run, so the job that downloads it can write the issues.
  api-endpoints:
    name: Check the API endpoint catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # opens an issue per operation and creates its label
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the API endpoint catalog
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: ./tools/Invoke-ApiEndpointCheck.ps1 -WhatIf:($env:DRY_RUN -eq 'true')

  # The code of the new module versions runs only in this job, which can write nothing; the next job writes the issue
  # and runs none of it.
  dependencies-test:
    name: Test dependency updates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      candidates: ${{ steps.find.outputs.candidates }}
      # The outcome of the tests: success, failure, or skipped without module candidates.
      tests: ${{ steps.tests.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Writes the module candidates into the lock files of this checkout, never committed.
      - name: Find updates
        id: find
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $path = Join-Path -Path $env:RUNNER_TEMP -ChildPath 'candidates.json'
          ./tools/Find-DependencyUpdate.ps1 -OutFile $path -UpdateLock
          $result = Get-Content -Path $path -Raw | ConvertFrom-Json
          Add-Content -Path $env:GITHUB_OUTPUT -Value "candidates=$($result | ConvertTo-Json -Compress -Depth 5)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "modules=$(@($result.Candidates | Where-Object { $_.Kind -eq 'Module' }).Count)"

      # A failure here is the result the issue reports, not a failed run.
      - name: Test the new module versions
        id: tests
        if: steps.find.outputs.modules != '0'
        continue-on-error: true
        shell: pwsh
        run: |
          ./tools/Install-DevTools.ps1 -ModulesOnly
          ./tools/Invoke-Coverage.ps1 -Target 0


  dependencies-report:
    name: Report dependency updates
    needs: dependencies-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # opens or updates the issue and creates its label
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The candidates and the test result come through env:, never into the script itself.
      - name: Report dependency updates
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry-run }}
          CANDIDATES: ${{ needs.dependencies-test.outputs.candidates }}
          TEST_RESULT: ${{ needs.dependencies-test.outputs.tests }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $path = Join-Path -Path $env:RUNNER_TEMP -ChildPath 'candidates.json'
          Set-Content -Path $path -Value $env:CANDIDATES
          ./tools/Invoke-DependencyUpdateCheck.ps1 -CandidatePath $path -TestResult $env:TEST_RESULT -RunUrl $env:RUN_URL -WhatIf:($env:DRY_RUN -eq 'true')
